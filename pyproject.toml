[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlpilot"
version = "0.1.0"
description = "Spider Text-to-SQL QLoRA training project"
requires-python = ">=3.10,<3.13"
dependencies = ["PyYAML>=6.0.1,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
